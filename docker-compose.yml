services:
  db:
    image: pgvector/pgvector:pg16
    container_name: adia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_document_assistant
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_document_assistant"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
